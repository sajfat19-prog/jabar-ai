<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jabar AI</title><style>
:root{--bg:#0b0d10;--panel:#12161c;--panel2:#171c23;--text:#f3f5f7;--muted:#8f98a6;--line:#262d36;--accent:#7c5cff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Tahoma,Arial,sans-serif;height:100vh;overflow:hidden}.app{display:flex;height:100vh}.side{width:280px;background:#0e1115;border-left:1px solid var(--line);padding:14px;display:flex;flex-direction:column;gap:14px}.brand{font-weight:800;font-size:20px;padding:8px 10px}.new{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:12px;padding:12px;cursor:pointer}.history{overflow:auto;display:flex;flex-direction:column;gap:5px}.history button{border:0;background:transparent;color:#cbd1da;text-align:right;padding:10px;border-radius:9px;cursor:pointer}.history button:hover{background:var(--panel2)}.user{margin-top:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px}.main{flex:1;display:flex;flex-direction:column;min-width:0}.top{height:64px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 20px}.model{background:var(--panel);color:var(--text);border:1px solid var(--line);padding:9px 12px;border-radius:10px}.pro{background:linear-gradient(135deg,#7c5cff,#a855f7);padding:8px 12px;border-radius:9px;font-size:13px;font-weight:700}.chat{flex:1;overflow:auto;padding:28px 16px}.empty{height:100%;display:flex;align-items:center;justify-content:center;text-align:center}.empty h1{font-size:34px;margin:0 0 10px}.empty p{color:var(--muted)}.messages{max-width:900px;margin:auto;display:flex;flex-direction:column;gap:18px}.msg{display:flex;gap:12px}.avatar{width:34px;height:34px;border-radius:10px;background:var(--panel2);display:grid;place-items:center;flex:none}.bubble{white-space:pre-wrap;line-height:1.8;max-width:calc(100% - 48px)}.composer{padding:15px 16px 22px}.box{max-width:900px;margin:auto;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:10px;box-shadow:0 10px 40px #0004}.textarea{width:100%;min-height:52px;max-height:180px;resize:none;background:transparent;border:0;outline:0;color:var(--text);font-size:16px;padding:8px}.tools{display:flex;align-items:center;justify-content:space-between;padding-top:6px}.tools-left{display:flex;gap:7px}.tool{background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:9px;padding:7px 10px;cursor:pointer}.send{background:var(--text);color:#111;border:0;border-radius:10px;padding:9px 15px;font-weight:700;cursor:pointer}.send:disabled{opacity:.4}.notice{text-align:center;color:#6f7885;font-size:11px;margin-top:8px}@media(max-width:760px){.side{display:none}.empty h1{font-size:28px}.top{padding:0 12px}}
</style></head><body><div class="app"><aside class="side"><div class="brand">✦ Jabar AI</div><button class="new" id="newChat">＋ محادثة جديدة</button><div class="history" id="history"></div><div class="user"><b>حساب تجريبي</b><div style="color:var(--muted);font-size:12px;margin-top:4px">خطة Pro</div></div></aside><main class="main"><header class="top"><select class="model" id="model"><option value="gpt-5.6-sol">GPT-5.6 Sol</option><option value="gpt-6-luna">GPT-6 Luna</option><option value="gpt-6-astra">GPT-6 Astra</option></select><span class="pro">PRO</span></header><section class="chat" id="chat"><div class="empty" id="empty"><div><h1>بماذا يمكنني مساعدتك؟</h1><p>اكتب سؤالك أو ابدأ مشروعاً جديداً.</p></div></div><div class="messages" id="messages"></div></section><section class="composer"><div class="box"><textarea class="textarea" id="input" placeholder="اكتب رسالتك هنا..." rows="1"></textarea><div class="tools"><div class="tools-left"><button class="tool" title="إرفاق ملف">📎 ملف</button><button class="tool" title="رفع صورة">🖼️ صورة</button><button class="tool" title="بحث ويب">⌕ بحث</button></div><button class="send" id="send">إرسال ↑</button></div></div><div class="notice">Jabar AI — منصة مستقلة. استخدام النماذج والخدمات الخارجية يخضع لسياسات ومفاتيح مزوديها.</div></section></main></div><script>
const input=document.getElementById('input'),send=document.getElementById('send'),messagesEl=document.getElementById('messages'),empty=document.getElementById('empty'),model=document.getElementById('model'),historyEl=document.getElementById('history');let messages=[], chats=[];
function render(){empty.style.display=messages.length?'none':'flex';messagesEl.innerHTML=messages.map(m=>`<div class="msg"><div class="avatar">${m.role==='user'?'👤':'✦'}</div><div class="bubble">${escapeHtml(m.content)}</div></div>`).join('');document.getElementById('chat').scrollTop=1e9}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function save(){localStorage.setItem('jabar_chats',JSON.stringify(chats));historyEl.innerHTML=chats.slice(-20).reverse().map((c,i)=>`<button data-i="${chats.length-1-i}">${escapeHtml(c.title)}</button>`).join('');historyEl.querySelectorAll('button').forEach(b=>b.onclick=()=>{messages=chats[+b.dataset.i].messages||[];render()})}
function add(role,content){messages.push({role,content});render()}
async function ask(){const text=input.value.trim();if(!text||send.disabled)return;input.value='';add('user',text);send.disabled=true;add('assistant','...');try{const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:messages.slice(0,-1),model:model.value})});const d=await r.json();messages[messages.length-1].content=d.text||('خطأ: '+(d.error||'غير معروف'));}catch(e){messages[messages.length-1].content='تعذر الاتصال بالخادم.'}finally{send.disabled=false;const title=messages.find(x=>x.role==='user')?.content?.slice(0,45)||'محادثة جديدة';const old=chats.findIndex(c=>c.title===title);if(old<0)chats.push({title,messages:[...messages]});else chats[old].messages=[...messages];save();render();}}
send.onclick=ask;input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();ask()}});document.getElementById('newChat').onclick=()=>{messages=[];render()};chats=JSON.parse(localStorage.getItem('jabar_chats')||'[]');save();render();
</script></body></html>
